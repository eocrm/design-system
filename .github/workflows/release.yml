name: Release

# Triggered on pushes to main that touch packages/** or workflows/**.
# Root-only changes (README, CLAUDE.md, Makefile) skip the workflow entirely.
#
# Inside the workflow:
# - quality runs always
# - publish runs ONLY if a library actually changed (packages/design-tokens,
#   packages/design-system, or one of the release-related workflow files).
#   Playground-only changes
#   skip the publish step → no version bump just because a demo page tweaked.
#   packages/design-system/CLAUDE.md is excluded too — it is the one file in
#   that package that never reaches the tarball (AGENTS.md, README.md, and
#   src/components/TODO.md all ship, so those DO warrant a release).
# - deploy-playground runs after a successful quality and publish, or when the
#   change detector succeeds and intentionally skips publishing.
#
# To force a major/minor bump, edit BUMP below on a branch and merge — there
# is no manual UI by design.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/**"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write # push the new git tag
  packages: write # publish to GitHub Packages
  pages: write # forwarded to the chained deploy-playground job
  id-token: write # forwarded to the chained deploy-playground job

env:
  BUMP: patch

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  detect-library-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need release tags and complete history to detect every unreleased change.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect library changes
        id: diff
        run: |
          set -euo pipefail
          changed=$(node packages/design-tokens/scripts/detect-library-changes.mjs "${{ github.sha }}")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ]; then
            echo "Library changed — publish will run."
          else
            echo "Library unchanged — publish will be skipped."
          fi

  publish:
    needs: [quality, detect-library-changes]
    if: needs.detect-library-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can read existing tags.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          # This writes .npmrc with the @eocrm scope pointed at GitHub Packages
          # and wires NODE_AUTH_TOKEN for the publish step below.
          registry-url: "https://npm.pkg.github.com"
          scope: "@eocrm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            packages/design-tokens/compose/**/*.gradle*
            packages/design-tokens/compose/gradle.properties
            packages/design-tokens/compose/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Install
        run: npm ci

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          LATEST=$(node packages/design-tokens/scripts/latest-stable-release-tag.mjs)
          if [ -z "${LATEST:-}" ]; then
            CURRENT="0.0.0"
            echo "No existing stable v* tag — starting from $CURRENT"
          else
            CURRENT="${LATEST#v}"
            echo "Latest version tag: $LATEST (parsed as $CURRENT)"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) echo "::error::Unknown BUMP value: $BUMP"; exit 1 ;;
          esac

          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Computed version '$NEW' is not valid semver"
            exit 1
          fi

          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW already exists; refusing to overwrite"
            exit 1
          fi

          echo "Next version: $NEW"
          echo "value=$NEW" >> "$GITHUB_OUTPUT"

      - name: Synchronize release version
        run: |
          node packages/design-tokens/scripts/set-release-version.mjs \
            "${{ steps.version.outputs.value }}" \
            --root "$GITHUB_WORKSPACE"

      - name: Verify token contract
        run: npm run tokens:check

      - name: Publish design tokens to GitHub Packages
        working-directory: packages/design-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm publish 2>&1 | tee token-publish.out
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "Published @eocrm/design-tokens."
          elif grep -qiE 'E409|cannot publish over existing version|409 Conflict' token-publish.out; then
            echo "::warning::@eocrm/design-tokens already has this exact version."
          else
            exit "$status"
          fi

      - name: Publish design system to GitHub Packages
        working-directory: packages/design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm publish 2>&1 | tee design-system-publish.out
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "Published @eocrm/design-system."
          elif grep -qiE 'E409|cannot publish over existing version|409 Conflict' design-system-publish.out; then
            echo "::warning::@eocrm/design-system already has this exact version."
          else
            exit "$status"
          fi

      - name: Publish Compose tokens to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          packages/design-tokens/compose/gradlew \
            --no-daemon \
            -p packages/design-tokens/compose \
            -Pversion="${{ steps.version.outputs.value }}" \
            -Dmaven.repo.local="$RUNNER_TEMP/compose-maven" \
            publishToMavenLocal
          node packages/design-tokens/scripts/repair-compose-publication.mjs \
            "$RUNNER_TEMP/compose-maven" \
            "${{ steps.version.outputs.value }}"

      - name: Verify published artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/design-tokens/scripts/verify-published-version.mjs \
            "${{ steps.version.outputs.value }}"

      - name: Tag and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${{ steps.version.outputs.value }}" -m "Release v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Summary
        run: |
          {
            echo "## Published"
            echo ""
            echo "- npm: \`@eocrm/design-tokens@${{ steps.version.outputs.value }}\`"
            echo "- npm: \`@eocrm/design-system@${{ steps.version.outputs.value }}\`"
            echo "- Maven: \`com.eocrm.design:design-tokens-compose:${{ steps.version.outputs.value }}\`"
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Tag: \`v${{ steps.version.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Re-deploy the playground so the live site reflects a successfully released
  # main, or a main change where publishing was intentionally skipped.
  deploy-playground:
    needs: [quality, detect-library-changes, publish]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.detect-library-changes.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' &&
      needs.detect-library-changes.outputs.changed == 'false'))
    uses: ./.github/workflows/deploy-playground.yml
    permissions:
      contents: read
      pages: write
      id-token: write

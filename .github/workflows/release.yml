name: Release

# Triggered on pushes to main that touch packages/** or workflows/**.
# Root-only changes (README, CLAUDE.md, Makefile) skip the workflow entirely.
#
# Inside the workflow:
# - quality runs always
# - publish runs ONLY if a library actually changed (packages/design-tokens,
#   packages/design-system, or one of the release-related workflow files).
#   Playground-only changes
#   skip the publish step → no version bump just because a demo page tweaked.
#   packages/design-system/CLAUDE.md is excluded too — it is the one file in
#   that package that never reaches the tarball (AGENTS.md, README.md, and
#   src/components/TODO.md all ship, so those DO warrant a release).
# - deploy-playground runs whenever quality passed (regardless of the publish
#   result) — so the live demo always reflects main, even on playground-only
#   changes.
#
# To force a major/minor bump, edit BUMP below on a branch and merge — there
# is no manual UI by design.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/**"

permissions:
  contents: write # push the new git tag
  packages: write # publish to GitHub Packages
  pages: write # forwarded to the chained deploy-playground job
  id-token: write # forwarded to the chained deploy-playground job

env:
  BUMP: patch

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  detect-library-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need previous commit to diff against.
          fetch-depth: 2

      - name: Detect library changes
        id: diff
        run: |
          set -euo pipefail
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            # No previous commit (initial push) — treat as a library change.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit — assuming library changed."
            exit 0
          fi

          # Library changes include the package itself plus the workflow files
          # that actually publish it. Quality.yml is here because if the gate
          # logic changes, we want a real publish run to verify it end-to-end.
          #
          # packages/design-system/CLAUDE.md is filtered out first: it is agent
          # instructions for working IN this repo and is not in package.json's
          # `files` whitelist, so editing it cannot change the tarball. Note the
          # other markdown under that package DOES ship (AGENTS.md and README.md
          # via `files`/npm, src/components/TODO.md via `src`), so only this one
          # exact path is excluded — not `*.md`.
          #
          # If CLAUDE.md is the ONLY changed file, the first grep emits nothing
          # and exits 1; under `pipefail` the pipeline is non-zero, the `if` is
          # false, and we correctly fall through to changed=false. `set -e` does
          # not fire because this is an `if` condition.
          if git diff --name-only HEAD^ HEAD \
            | grep -vxF 'packages/design-system/CLAUDE.md' \
            | grep -qE '^packages/design-(tokens|system)/|^\.github/workflows/(release|quality|deploy-playground)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Library changed — publish will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Library unchanged — publish will be skipped."
          fi

  publish:
    needs: [quality, detect-library-changes]
    if: needs.detect-library-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can read existing tags.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # This writes .npmrc with the @eocrm scope pointed at GitHub Packages
          # and wires NODE_AUTH_TOKEN for the publish step below.
          registry-url: "https://npm.pkg.github.com"
          scope: "@eocrm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Install
        run: npm ci

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "${LATEST:-}" ]; then
            CURRENT="0.0.0"
            echo "No existing v* tag — starting from $CURRENT"
          else
            CURRENT="${LATEST#v}"
            echo "Latest version tag: $LATEST (parsed as $CURRENT)"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) echo "::error::Unknown BUMP value: $BUMP"; exit 1 ;;
          esac

          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Computed version '$NEW' is not valid semver"
            exit 1
          fi

          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW already exists; refusing to overwrite"
            exit 1
          fi

          echo "Next version: $NEW"
          echo "value=$NEW" >> "$GITHUB_OUTPUT"

      - name: Synchronize release version
        run: |
          node packages/design-tokens/scripts/set-release-version.mjs \
            "${{ steps.version.outputs.value }}" \
            --root "$GITHUB_WORKSPACE"

      - name: Verify token contract
        run: npm run tokens:check

      - name: Publish design tokens to GitHub Packages
        working-directory: packages/design-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm publish 2>&1 | tee token-publish.out
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "Published @eocrm/design-tokens."
          elif grep -qiE 'E409|cannot publish over existing version|409 Conflict' token-publish.out; then
            echo "::warning::@eocrm/design-tokens already has this exact version."
          else
            exit "$status"
          fi

      - name: Publish design system to GitHub Packages
        working-directory: packages/design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npm publish 2>&1 | tee design-system-publish.out
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "Published @eocrm/design-system."
          elif grep -qiE 'E409|cannot publish over existing version|409 Conflict' design-system-publish.out; then
            echo "::warning::@eocrm/design-system already has this exact version."
          else
            exit "$status"
          fi

      - name: Publish Compose tokens to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          publish_compose_task() {
            task="$1"
            log="compose-${task}.out"
            packages/design-tokens/compose/gradlew \
              --no-daemon \
              -p packages/design-tokens/compose \
              -Pversion="${{ steps.version.outputs.value }}" \
              "$task" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "Completed $task."
            elif grep -qiE '409|already exists|already been published' "$log"; then
              echo "::warning::$task already has this version; continuing with remaining publications."
            else
              exit "$status"
            fi
          }

          # Publish independently so a 409 on an existing variant cannot stop
          # Gradle before it attempts a later, missing variant.
          publish_compose_task publishAndroidPublicationToGitHubPackagesRepository
          publish_compose_task publishIosArm64PublicationToGitHubPackagesRepository
          publish_compose_task publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          publish_compose_task publishJvmPublicationToGitHubPackagesRepository
          publish_compose_task publishKotlinMultiplatformPublicationToGitHubPackagesRepository

      - name: Verify published artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/design-tokens/scripts/verify-published-version.mjs \
            "${{ steps.version.outputs.value }}"

      - name: Tag and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${{ steps.version.outputs.value }}" -m "Release v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Summary
        run: |
          {
            echo "## Published"
            echo ""
            echo "- npm: \`@eocrm/design-tokens@${{ steps.version.outputs.value }}\`"
            echo "- npm: \`@eocrm/design-system@${{ steps.version.outputs.value }}\`"
            echo "- Maven: \`com.eocrm.design:design-tokens-compose:${{ steps.version.outputs.value }}\`"
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Tag: \`v${{ steps.version.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Re-deploy the playground so the live site always reflects main. Runs whenever
  # quality passed — regardless of the publish result (success / skipped /
  # failure) — so the demo stays current even on playground-only changes and
  # even if a publish hiccups.
  deploy-playground:
    needs: [quality, publish]
    if: always() && needs.quality.result == 'success'
    uses: ./.github/workflows/deploy-playground.yml
    permissions:
      contents: read
      pages: write
      id-token: write

name: Quality

# Two triggers:
# - pull_request: every PR runs the full quality suite. This is the PR gate.
# - workflow_call: release.yml chains us as the prerequisite job, so publishing
#   can't happen if quality fails.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Stylelint
        run: npm run lint:css

      - name: Build playground (smoke-tests the library inside a real consumer)
        run: npm run build

      - name: Verify tarball contents
        working-directory: packages/design-system
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          # Fail loudly if test files or internal-only paths leaked.
          if grep -E '\.test\.(t|j)sx?|\.spec\.|/types/|CLAUDE\.md|tsconfig' /tmp/pack.json; then
            echo "::error::Tarball contains files that should be excluded"
            exit 1
          fi
          echo "Tarball OK"

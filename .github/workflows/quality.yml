name: Quality

# Two triggers:
# - pull_request: every PR runs the full quality suite. This is the PR gate.
# - workflow_call: release.yml chains us as the prerequisite job, so publishing
#   can't happen if quality fails.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            packages/design-tokens/compose/**/*.gradle*
            packages/design-tokens/compose/gradle.properties
            packages/design-tokens/compose/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Install
        run: npm ci

      - name: Verify design-token contract
        run: npm run tokens:check

      - name: Verify Compose multiplatform artifact
        working-directory: packages/design-tokens/compose
        run: ./gradlew --no-daemon jvmTest testAndroidHostTest assemble

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Stylelint
        run: npm run lint:css

      - name: Build playground (smoke-tests the library inside a real consumer)
        run: npm run build

      - name: Install Chromium for the focus-ring sweep
        run: npx playwright install --with-deps chromium

      # Ring COLOUR is gated in packages/design-system/src/styles/contrast.test.ts.
      # This gates its GEOMETRY: since #505 the ring is an outline at a positive
      # offset, so a focusable flush against an overflow ancestor loses whole
      # bands, and jsdom computes no layout so the vitest suite cannot see it.
      # Needs a real browser; there is no cheaper place to put it.
      #
      # It covers outset rings against non-scrolling clip axes on statically
      # rendered demo content. It does NOT open overlays, so menus, listboxes,
      # dialogs and pickers are unswept, and it is silent on scroll extremes and
      # on ancestors that clip with a border. A green run here is not the whole
      # class — playwright.config.ts states the scope in full.
      - name: Focus-ring geometry sweep
        run: npm run test:focus-geometry

      - name: Upload sweep report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Verify tarball contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json --workspace @eocrm/design-tokens > /tmp/tokens-pack.json
          npm pack --dry-run --json --workspace @eocrm/design-system > /tmp/design-system-pack.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const checks = [
            {
              name: '@eocrm/design-tokens',
              path: '/tmp/tokens-pack.json',
              forbidden: [
                /(?:^|\/)src\//,
                /(?:^|\/)test\//,
                /CLAUDE\.md$/,
                /(?:^|\/)compose\//,
                /(?:^|\/)scripts\//,
              ],
            },
            {
              name: '@eocrm/design-system',
              path: '/tmp/design-system-pack.json',
              forbidden: [
                /\.test\.(?:t|j)sx?$/,
                /\.spec\./,
                /(?:^|\/)types\//,
                /CLAUDE\.md$/,
                /tsconfig/,
                /(?:^|\/)compose\//,
              ],
            },
          ];

          for (const check of checks) {
            const [{ files }] = JSON.parse(await readFile(check.path, 'utf8'));
            const leaked = files
              .map(({ path }) => path)
              .filter((path) => check.forbidden.some((pattern) => pattern.test(path)));
            if (leaked.length > 0) {
              console.error(`::error::${check.name} tarball leaked:\n${leaked.join('\n')}`);
              process.exitCode = 1;
            } else {
              console.log(`${check.name} tarball OK (${files.length} files)`);
            }
          }
          NODE

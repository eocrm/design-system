name: Quality

# Two triggers:
# - pull_request: stages are path-selected by scripts/ci-changes.sh (#614) and
#   run as parallel jobs; the `check` aggregator is the required PR gate.
# - workflow_call: release.yml chains us as the prerequisite job. Anything but
#   a pull_request event runs EVERY stage, so publishing can't skip a gate.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ds: ${{ steps.detect.outputs.ds }}
      tokens: ${{ steps.detect.outputs.tokens }}
      compose: ${{ steps.detect.outputs.compose }}
      playground: ${{ steps.detect.outputs.playground }}
      package: ${{ steps.detect.outputs.package }}
      tooling: ${{ steps.detect.outputs.tooling }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected stages
        id: detect
        run: >-
          scripts/ci-changes.sh "${{ github.event_name }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Stylelint
        run: npm run lint:css

  test-ds:
    needs: changes
    if: needs.changes.outputs.ds == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -w @eocrm/design-system

  tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Verify design-token contract
        run: npm run tokens:check

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test release and workflow tooling
        run: npm run test:tooling

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            packages/design-tokens/compose/**/*.gradle*
            packages/design-tokens/compose/gradle.properties
            packages/design-tokens/compose/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The v3 default is `tools platform-tools`, but Google removed the
          # obsolete `tools` package from the SDK repository, so sdkmanager
          # exits 1 with "Failed to find package 'tools'" on every run. Only
          # platform-tools is needed here — the platform itself is installed
          # by the next step.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Verify Compose multiplatform artifact
        working-directory: packages/design-tokens/compose
        run: ./gradlew --no-daemon jvmTest testAndroidHostTest assemble

  playground:
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build playground (smoke-tests the library inside a real consumer)
        run: npm run build

      - name: Install Chromium for the focus-ring sweep
        run: npx playwright install --with-deps chromium

      # Ring COLOUR is gated in packages/design-system/src/styles/contrast.test.ts.
      # This gates its GEOMETRY: since #505 the ring is an outline at a positive
      # offset, so a focusable flush against an overflow ancestor loses whole
      # bands, and jsdom computes no layout so the vitest suite cannot see it.
      # Needs a real browser; there is no cheaper place to put it.
      #
      # It covers outset rings against non-scrolling clip axes on statically
      # rendered demo content. It does NOT open overlays, so menus, listboxes,
      # dialogs and pickers are unswept, and it is silent on scroll extremes and
      # on ancestors that clip with a border. A green run here is not the whole
      # class — playwright.config.ts states the scope in full.
      - name: Focus-ring geometry sweep
        run: npm run test:focus-geometry

      - name: Upload sweep report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Verify tarball contents
        run: node scripts/verify-package-contents.mjs

  check:
    # The required status is `Quality / check`: this aggregator keeps that name.
    # Skipped (path-selected out) jobs pass; failed or cancelled jobs fail it.
    if: always()
    needs: [changes, static, test-ds, tokens, tooling, compose, playground, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success \
            || { echo "::error::changes job did not succeed"; exit 1; }
          bad=$(echo "$RESULTS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')
          test "$bad" = 0 || { echo "::error::$bad Quality job(s) failed or were cancelled"; exit 1; }
